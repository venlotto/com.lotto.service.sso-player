# GENERATED by koperca-sdlc. Deploys a green SHA to a stage and bakes it.
name: deploy
on:
  workflow_dispatch:
    inputs:
      stage: { description: 'Target stage', required: true, type: choice,
               options: [dev1, dev2, dev3, dev4, dev, sta] }
      sha:   { description: 'SHA to deploy (default: current HEAD)', required: false, type: string }

# One deploy per stage at a time. Two concurrent deploys to the same stage race
# in Coolify and produce a container from an indeterminate commit.
concurrency:
  group: deploy-${{ inputs.stage }}-${{ github.repository }}
  cancel-in-progress: false

# The harness and the metrics clone both live ON the runner, exactly as
# verify.yml uses them: checking koperca-sdlc out per job would mean handing a
# deploy key to every repo as a secret, and a self-hosted runner does not need
# one. KOP_SSH is required because Coolify and the LXD host are reachable only
# from the host, through the koperhost alias.
env:
  KOPERCA_SDLC: /opt/koperca-sdlc
  KOPERCA_FLEET_METRICS: /opt/fleet-metrics
  KOPERCA_SKILL_DIR: /home/runner/repos/infra-handbook/skills/koperca-deploy-service/scripts
  KOP_SSH: koperhost

jobs:
  deploy:
    runs-on: [self-hosted, koperca]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}

      # The gate reads the quality record out of this clone. It is long-lived,
      # so a stale one reports "no quality record" for a SHA whose record is
      # already on GitHub.
      - name: Refresh quality records
        run: git -C "$KOPERCA_FLEET_METRICS" pull --ff-only --quiet

      # deploy.sh refuses without a green quality record, so this step is also
      # the gate — there is no separate "check if allowed" step to forget.
      - name: Deploy
        run: |
          "$KOPERCA_SDLC/gates/deploy.sh" \
            "${{ github.event.repository.name }}" "${{ inputs.stage }}" "${{ inputs.sha || github.sha }}"

      # bake.sh reads slo.yaml from the checkout, so this must run in the repo.
      - name: Bake
        id: bake
        run: |
          "$KOPERCA_SDLC/gates/bake.sh" "${{ github.event.repository.name }}" "${{ inputs.stage }}"

      - name: Mark baked clean
        if: success()
        run: |
          node "$KOPERCA_SDLC/gates/ship-metrics.mjs" --mark-baked \
            "${{ github.event.repository.name }}" "${{ inputs.sha || github.sha }}" "${{ inputs.stage }}"

      # Rollback is the DEFAULT response to a bad bake, not an exception path.
      - name: Roll back
        if: failure() && steps.bake.outcome == 'failure'
        run: |
          "$KOPERCA_SDLC/gates/rollback.sh" \
            "${{ github.event.repository.name }}" "${{ inputs.stage }}" "bake failed"
