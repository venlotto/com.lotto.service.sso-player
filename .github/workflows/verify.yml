# GENERATED by koperca-sdlc v1.
name: verify

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Self-hosted only: these runners sit inside 10.40.188.0/24, which is the
    # only place integration tests and stage E2E can reach. Also unmetered.
    runs-on: [self-hosted, koperca]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # patch coverage and contract diffs need history

      # The harness lives ON the runner at /opt/koperca-sdlc, refreshed every
      # 10 minutes by koperca-sdlc-update.timer. Checking it out per job would
      # mean distributing a deploy key to every repo as a secret; a self-hosted
      # runner does not need that, and fewer copies of a credential is strictly
      # better.
      - name: Verify
        env:
          KOPERCA_SDLC: /opt/koperca-sdlc
          STAGE: ci
        run: |
          make bootstrap
          make verify

      - name: Publish quality record
        if: always()
        env:
          KOPERCA_SDLC: /opt/koperca-sdlc
          # fleet-metrics is reached with the runner's write deploy key via the
          # github-fleet ssh alias — again, no secret in the repo.
          KOPERCA_FLEET_METRICS: /opt/fleet-metrics
          OTLP_ENDPOINT: ${{ vars.OTLP_ENDPOINT }}
        run: node $KOPERCA_SDLC/gates/ship-metrics.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ github.sha }}
          path: reports/
          retention-days: 14
